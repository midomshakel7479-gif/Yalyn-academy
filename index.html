<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yalyn Academy</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050817; --panel:#0e1535; --panel2:#0a0f28; --line:#ffffff17;
    --text:#f2f4ff; --muted:#98a2c0;
    --violet:#8b5cf6; --violet2:#7c3aed; --cyan:#22d3ee; --gold:#fbbf24; --green:#34d399; --red:#f16a5c;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 0%,#32116e 0,transparent 30%),
      radial-gradient(circle at 95% 15%,#003e5d 0,transparent 27%),
      var(--bg);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    position:relative;
  }
  body:before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:70px 70px;opacity:.05;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--violet);color:#fff;}

  /* Top bar */
  .topbar{
    background:#040716dd;backdrop-filter:blur(18px);
    color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;
    position:sticky;top:0;z-index:20;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.2px;cursor:pointer;}
  .brand .mark{
    width:36px;height:36px;border-radius:11px;
    background:linear-gradient(135deg,#ffcf48,#8b5cf6 55%,#22d3ee);
    display:flex;align-items:center;justify-content:center;color:#0a0f28;font-weight:900;font-size:16px;
    box-shadow:0 0 22px #8b5cf666;
  }
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .pill{
    background:#ffffff10;border:1px solid #ffffff30;color:#fff;
    padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;
  }
  .pill:hover{background:#ffffff1c;}
  .langbtn{background:transparent;border:1px solid #ffffff40;color:#fff;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 18px 60px;position:relative;z-index:1;}

  /* Hero / home */
  .hero{text-align:center;padding:56px 18px 30px;}
  .hero-avatar{
    width:76px;height:76px;border-radius:50%;object-fit:cover;
    box-shadow:0 0 0 3px #0a0f28, 0 0 26px #8b5cf688;
    margin-bottom:14px;
  }
  .hero h1{font-size:40px;margin:0 0 8px;font-weight:800;
    background:linear-gradient(90deg,#fff,#c4b5fd 60%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--muted);font-size:16px;margin:0 0 34px;}
  .role-cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
  .role-card{
    background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 34px;width:230px;text-align:center;
    box-shadow:0 20px 50px #00000066;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .role-card:hover{transform:translateY(-4px);box-shadow:0 26px 60px #0008;}
  .role-card .icon{font-size:34px;margin-bottom:10px;filter:drop-shadow(0 0 10px #8b5cf688);}
  .role-card h3{margin:6px 0 4px;color:#fff;font-size:19px;}
  .role-card p{color:var(--muted);font-size:13px;margin:0 0 16px;}
  .btn{
    display:inline-block;background:linear-gradient(135deg,var(--violet2),var(--cyan));color:#fff;border:none;
    padding:10px 20px;border-radius:11px;font-weight:700;font-size:14px;
    box-shadow:0 10px 26px #6d28d955;transition:.15s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px #6d28d977;}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#1a1200;box-shadow:0 10px 26px #f59e0b44;}
  .btn.gold:hover{box-shadow:0 14px 32px #f59e0b66;}
  .btn.outline{background:transparent;color:#fff;border:1.5px solid #ffffff45;box-shadow:none;}
  .btn.outline:hover{background:#ffffff12;}
  .btn.danger{background:linear-gradient(135deg,var(--red),#b8503f);color:#fff;box-shadow:0 10px 22px #b8503f44;}
  .btn.small{padding:6px 12px;font-size:12.5px;border-radius:8px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;}
  .link-btn{background:none;border:none;color:var(--cyan);text-decoration:underline;font-size:13px;padding:4px;}

  .demo-link{margin-top:22px;}

  /* Login card */
  .center-card{
    max-width:400px;margin:60px auto;background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--radius);padding:32px 28px;box-shadow:0 20px 50px #0007;
  }
  .center-card h2{margin-top:0;color:#fff;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;background:#080c22;color:var(--text);
  }
  .field textarea{min-height:110px;resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--violet);border-color:var(--violet);}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .err{color:#ff9c8c;font-size:13px;margin-top:8px;font-weight:600;}

  /* Dashboard layout */
  .dash{display:flex;gap:20px;align-items:flex-start;}
  .ledger-rail{
    background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);padding:12px;
    display:flex;flex-direction:column;gap:4px;min-width:215px;
    box-shadow:0 16px 40px #0006;
  }
  .profile-mini{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:#ffffff08;}
  .profile-mini img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 16px #8b5cf655;flex:none;}
  .profile-mini .avatar-fallback{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;}
  .profile-mini b{display:block;font-size:13.5px;color:#fff;}
  .profile-mini span{font-size:11px;color:var(--green);}
  .ledger-rail .rail-title{color:var(--muted);font-size:11px;font-weight:700;padding:8px 10px 4px;letter-spacing:.5px;opacity:.85;text-transform:uppercase;}
  .rail-tab{
    display:flex;align-items:center;gap:10px;
    background:transparent;border:none;color:var(--muted);
    padding:10px 12px;border-radius:11px;font-size:14px;font-weight:600;text-align:start;
  }
  .rail-tab .n{
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--gold);
    width:24px;height:24px;border:1px solid #ffffff2a;border-radius:7px;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .rail-tab:hover{background:#ffffff0c;color:#fff;}
  .rail-tab.active{background:linear-gradient(135deg,var(--violet2),var(--cyan));color:#fff;box-shadow:0 8px 22px #7c3aed55;}
  .rail-tab.active .n{border-color:#ffffff70;color:#fff;}

  .dash-main{flex:1;min-width:0;}

  /* Hero banner inside dashboard */
  .hero-banner{
    position:relative;overflow:hidden;border-radius:22px;border:1px solid #a78bfa33;
    background:linear-gradient(120deg,#0a0c2bee,#111149d9 55%,#071c31aa);
    padding:28px 30px;margin-bottom:18px;box-shadow:0 20px 55px #0007;
  }
  .hero-banner:after{
    content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:var(--violet);
    opacity:.32;filter:blur(60px);inset-inline-end:-70px;top:-70px;animation:float 6s ease-in-out infinite;
  }
  .hero-banner .eyebrow{font-size:11px;color:#c4b5fd;text-transform:uppercase;letter-spacing:2px;position:relative;z-index:1;}
  .hero-banner h1{font-size:27px;margin:8px 0;position:relative;z-index:1;color:#fff;}
  .hero-banner h1 span{color:#c084fc;}
  .hero-banner p{color:#b7bfd4;max-width:580px;position:relative;z-index:1;line-height:1.7;}
  .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1;}
  @keyframes float{50%{transform:translateY(-8px);}}

  /* KPI cards */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:17px;padding:17px;position:relative;overflow:hidden;box-shadow:0 16px 40px #0006;}
  .kpi:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;filter:blur(24px);opacity:.5;inset-inline-end:-30px;bottom:-30px;}
  .kpi.violet:after{background:var(--violet);} .kpi.cyan:after{background:var(--cyan);}
  .kpi.gold:after{background:var(--gold);} .kpi.green:after{background:var(--green);}
  .kpi .label{color:var(--muted);font-size:12px;position:relative;z-index:1;}
  .kpi .value{font-family:'JetBrains Mono',monospace;font-size:27px;font-weight:700;margin-top:6px;position:relative;z-index:1;color:#fff;}
  @media (max-width:760px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}

  .lower-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;}
  @media (max-width:900px){.lower-grid{grid-template-columns:1fr;}}

  .card{
    background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;margin-bottom:18px;box-shadow:0 16px 40px #0006;
  }
  .card h3{margin:0 0 14px;color:#fff;font-size:17px;}
  .card .muted-sub{color:var(--muted);font-size:11.5px;margin-top:-10px;margin-bottom:12px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;}
  .row .field{flex:1;min-width:160px;margin-bottom:0;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
  tr:last-child td{border-bottom:none;}

  .chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;}
  .chip.green{background:#34d39922;color:#5ee9ad;}
  .chip.red{background:#f16a5c22;color:#ff9c8c;}
  .chip.gold{background:#fbbf2422;color:#ffd873;}

  .list-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 4px;border-bottom:1px solid var(--line);
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .meta{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .empty{color:var(--muted);font-size:14px;padding:16px 4px;text-align:center;}

  .qcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#0a0f28;}
  .qcard .qtype{font-size:11px;font-weight:700;color:var(--cyan);text-transform:uppercase;}
  .qcard .opts{margin:8px 0 0;padding:0;list-style:none;}
  .qcard .opts li{padding:5px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:#0e1535;font-size:13.5px;}
  .qcard label.opt{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:6px;background:#0e1535;font-size:14px;}
  .qcard label.opt:hover{border-color:var(--violet);}
  .check-row{display:flex;align-items:center;gap:8px;padding:6px 4px;}

  /* Stamp badge for scores */
  .stamp-wrap{display:flex;justify-content:center;padding:14px 0 6px;}
  .stamp{
    width:130px;height:130px;border-radius:50%;background:var(--panel2);
    border:4px double var(--green);color:var(--green);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-8deg);font-family:'JetBrains Mono',monospace;box-shadow:0 0 30px #34d39944;
  }
  .stamp.fail{border-color:var(--red);color:#ff9c8c;box-shadow:0 0 30px #f16a5c44;}
  .stamp .big{font-size:30px;font-weight:700;}
  .stamp .small{font-size:11px;font-weight:600;letter-spacing:.5px;}

  /* Ring + bar charts */
  .ring-wrap{position:relative;width:150px;height:150px;margin:8px auto 4px;}
  .ring{width:150px;height:150px;border-radius:50%;box-shadow:0 0 35px #22d3ee22;}
  .ring-center{position:absolute;inset:13px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .ring-center b{font-size:21px;font-family:'JetBrains Mono',monospace;color:#fff;}
  .ring-center span{font-size:9.5px;color:var(--muted);margin-top:2px;}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:10px;font-size:11.5px;color:var(--muted);}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px;vertical-align:middle;}

  .barchart-wrap{overflow-x:auto;padding-bottom:6px;}
  .barchart{display:flex;align-items:end;gap:9px;height:170px;padding:14px 4px 26px;min-width:max-content;}
  .barchart .bar{width:26px;min-height:4px;border-radius:8px 8px 3px 3px;background:linear-gradient(to top,var(--violet2),var(--cyan));box-shadow:0 0 16px #7c3aed44;position:relative;}
  .barchart .bar .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap;}
  .barchart .bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff;font-family:'JetBrains Mono',monospace;}

  .msg{max-width:75%;padding:10px 14px;border-radius:14px;margin-bottom:10px;font-size:14px;line-height:1.5;}
  .msg.mine{background:linear-gradient(135deg,var(--violet2),var(--cyan));color:#fff;margin-inline-start:auto;border-end-end-radius:3px;}
  .msg.theirs{background:#0e1535;color:var(--text);border:1px solid var(--line);border-end-start-radius:3px;}
  .msg .when{font-size:10.5px;opacity:.65;margin-top:4px;}

  .exam-q{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .exam-q .qn{font-weight:700;color:#fff;margin-bottom:10px;}

  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-inline-end:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .tag-btn{background:#0e1535;border:1.5px solid var(--line);padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text);}
  .tag-btn.active{background:linear-gradient(135deg,var(--violet2),var(--cyan));color:#fff;border-color:transparent;}

  .ai-card{margin-top:0;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:15px;background:linear-gradient(135deg,#25104f,#092d3f);overflow:hidden;border:1px solid var(--line);}
  .ai-card .robot{font-size:42px;filter:drop-shadow(0 0 16px #22d3ee);animation:float 3s ease-in-out infinite;flex:none;}

  @media (max-width:760px){
    .dash{flex-direction:column;}
    .ledger-rail{flex-direction:row;flex-wrap:wrap;min-width:0;width:100%;}
    .profile-mini{display:none;}
    .rail-tab{flex:1;justify-content:center;}
    .hero-banner h1{font-size:22px;}
  }
  a{color:var(--cyan);}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================ DATA / I18N ============================ */
const GRADES = [

  {id:'g11', ar:'الثاني الثانوي',       en:'Grade 11 · Secondary'},
  {id:'g12', ar:'الثالث الثانوي',       en:'Grade 12 · Secondary'},

async function getData(key, def){
  if(sb){
    try{
      const { data, error } = await sb.from('app_data').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      if(data) return data.value;
      // not in Supabase yet — fall through to a local cache (e.g. first ever load)
    }catch(e){ console.warn('Supabase read failed: ' + (e && (e.message || e.code || JSON.stringify(e)))); }
  }
  try{
    if(!hasPersistentStorage) throw new Error('no storage');
    const raw = localStorage.getItem(LS_PREFIX+key);
    return raw ? JSON.parse(raw) : def;
  }catch(e){
    return memoryStore.hasOwnProperty(key) ? JSON.parse(JSON.stringify(memoryStore[key])) : def;
  }
}

  }

    return true;
  }catch(e){ return true; }
}

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function arrayBufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for(let i=0;i<bytes.length;i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}
async function extractPdfViaServer(buf){
  const b64 = arrayBufferToBase64(buf);
  const r = await fetch('/api/extract-pdf', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ pdfBase64: b64 })
  });
  if(!r.ok) throw new Error('extract-pdf route unavailable: '+r.status);
  const data = await r.json();
  return data.text || '';
}
async function extractPdfInBrowser(buf){
  if(!window.pdfjsLib) throw new Error('pdf.js not loaded');
  const pdf = await pdfjsLib.getDocument({data:buf, disableWorker:true}).promise;
  let text = '';
  const maxPages = Math.min(pdf.numPages, 30);
  for(let i=1;i<=maxPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}
async function handlePdfUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('pdfStatus');
  if(statusEl) statusEl.textContent = t('extracting');
  try{
    const buf = await file.arrayBuffer();
    let text = '';
    // Prefer server-side extraction (reliable, works once deployed on Vercel).
    // Falls back to extracting in the browser if the server route isn't
    // reachable yet — e.g. while previewing before deployment.
    try{
      text = await extractPdfViaServer(buf);
    }catch(serverErr){
      console.warn('Server PDF extraction unavailable, using browser fallback: ' + (serverErr && serverErr.message));
      text = await extractPdfInBrowser(buf);
    }
    text = text.trim().slice(0, 12000);
    const textEl = document.getElementById('cText');
    const titleEl = document.getElementById('cTitle');
    if(textEl) textEl.value = text;
    if(titleEl && !titleEl.value) titleEl.value = file.name.replace(/\.pdf$/i,'');
    if(statusEl) statusEl.textContent = text ? '' : (state.lang==='ar' ? 'الملف مقروء لكن لم يحتوِ على نص — قد يكون صورة ممسوحة ضوئيًا.' : 'File read but contained no text — it may be a scanned image.');
  }catch(e){

/* ============================ AI CALLS ============================ */
// Tries the app's own serverless API route first (used once this is deployed
// on Vercel with an ANTHROPIC_API_KEY set). If that route isn't available —
// e.g. while previewing inside Claude — it falls back to calling the model
// directly, which Claude's own sandbox proxies automatically.
async function callViaProxy(path, payload){
  try{
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    if(!r.ok) throw new Error('proxy route unavailable: '+r.status);
    return await r.json();
  }catch(e){ return null; }
}
async function callClaudeDirect(system, user){
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1200, system, messages:[{role:"user", content:user}] })
  });
  const data = await resp.json();
  const text = (data.content||[]).map(b=>b.text||"").join("");
  return text.replace(/```json|```/g,"").trim();
}

const QGEN_SYSTEM = (gradeLabel) => `You are an expert K-12 curriculum question-bank writer. Given lesson content for the level "${gradeLabel}", write exactly 6 exam questions calibrated to that grade's difficulty: 4 multiple-choice and 2 short-answer. Reply with ONLY a raw JSON array, no markdown fences, no commentary. Each element must be exactly:
{"type":"mcq","question":"...","options":["...","...","...","..."],"answer":"the exact text of the correct option"}
or
{"type":"short","question":"...","answer":"a concise 1-2 sentence model answer used later for grading"}
Write all question/option/answer text in the same language as the lesson content provided.`;

const GRADE_SYSTEM = `You are grading short-answer exam responses for a K-12 student. For each item compare the student's answer to the model answer; be reasonably lenient about wording but require the core idea to be correct. Reply with ONLY a raw JSON array (same order, no markdown fences): [{"score":1,"feedback":"one short sentence, same language as the question"}] where score is 0 or 1.`;

async function aiGenerateQuestions(contentText, gradeLabel){
  const proxied = await callViaProxy('/api/generate-questions', {contentText, gradeLabel});
  let arr;
  if(proxied && proxied.questions){
    arr = proxied.questions;
  } else {
    const raw = await callClaudeDirect(QGEN_SYSTEM(gradeLabel), `Lesson content:\n${contentText}`);
    arr = JSON.parse(raw);
  }
  return arr.map(q=>({id:uid(), ...q}));
}
async function aiGradeShortAnswers(items){
  const proxied = await callViaProxy('/api/grade-answers', {items});
  if(proxied && proxied.results) return proxied.results;
  const raw = await callClaudeDirect(GRADE_SYSTEM, JSON.stringify(items));
  return JSON.parse(raw);
}

/* ============================ ANALYTICS ============================ */
function bucketsFromResults(results){
  const b = {excellent:0, good:0, average:0, weak:0};
  results.forEach(r=>{
    const p = pct(r.score, r.total);
    if(p>=90) b.excellent++; else if(p>=70) b.good++; else if(p>=50) b.average++; else b.weak++;
  });
  return {...b, total:results.length};
}
function ringStyle(b){
  if(b.total===0) return `background:conic-gradient(#ffffff1c 0 100%);`;
  const p1 = b.excellent/b.total*100;
  const p2 = p1 + b.good/b.total*100;
  const p3 = p2 + b.average/b.total*100;
  return `background:conic-gradient(var(--green) 0 ${p1}%, var(--cyan) ${p1}% ${p2}%, var(--gold) ${p2}% ${p3}%, var(--red) ${p3}% 100%);`;
}
function ringChart(results, avgLabel){
  const b = bucketsFromResults(results);
  const avg = b.total ? Math.round(results.reduce((s,r)=>s+pct(r.score,r.total),0)/b.total) : 0;
  return `
  <div class="ring-wrap">
    <div class="ring" style="${ringStyle(b)}"></div>
    <div class="ring-center"><b>${b.total? avg+'%':'—'}</b><span>${avgLabel}</span></div>
  </div>
  <div class="legend">
    <span><i style="background:var(--green)"></i>${t('excellent')} · ${b.excellent}</span>
    <span><i style="background:var(--cyan)"></i>${t('good')} · ${b.good}</span>
    <span><i style="background:var(--gold)"></i>${t('average')} · ${b.average}</span>
    <span><i style="background:var(--red)"></i>${t('weak')} · ${b.weak}</span>
  </div>`;
}
function barChart(items){ // items: [{label, value(0-100)}]
  const max = Math.max(100, ...items.map(i=>i.value));
  return `<div class="barchart-wrap"><div class="barchart">
    ${items.map(i=>`
      <div class="bar" style="height:${Math.max(4, i.value/max*100)}%;">
        <span class="val">${i.value?i.value+'%':''}</span>
        <span class="lbl">${i.label}</span>
      </div>`).join('')}
  </div></div>`;
}
async function loadAcademyAnalytics(){
  let totalStudents=0, totalExams=0, allResults=[], allExamsFlat=[];
  const perGrade=[];
  for(const g of GRADES){
    const students = await getData('students:'+g.id, []);
    const exams = await getData('exams:'+g.id, []);
    const results = await getData('results:'+g.id, []);
    totalStudents += students.length;
    totalExams += exams.length;
    results.forEach(r=> allResults.push({...r}));
    exams.forEach(e=> allExamsFlat.push({...e, gradeId:g.id, gradeLabel:gradeName(g)}));
    const avg = results.length ? Math.round(results.reduce((s,r)=>s+pct(r.score,r.total),0)/results.length) : 0;
    perGrade.push({label:gradeName(g).split(/[·—-]/)[0].trim().slice(0,10), value:avg});
  }
  const totalAttempts = allResults.length;
  const avgScore = totalAttempts ? Math.round(allResults.reduce((s,r)=>s+pct(r.score,r.total),0)/totalAttempts) : 0;
  const passCount = allResults.filter(r=> pct(r.score,r.total)>=50).length;
  const passRate = totalAttempts ? Math.round(passCount/totalAttempts*100) : 0;
  const recentExams = allExamsFlat.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,6).map(e=>{
    const related = allResults.filter(r=>r.examId===e.id);
    const avg = related.length? Math.round(related.reduce((s,r)=>s+pct(r.score,r.total),0)/related.length) : null;
    return {...e, attempts:related.length, avg};
  });
  return {totalStudents, totalExams, totalAttempts, avgScore, passRate, allResults, perGrade, recentExams};
}

// Parses a simple pasted-text format into questions, so teachers with
// ready-made exams can add them directly without generating anything.
function parseImportedQuestions(raw){
  const blocks = raw.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
  const out = [];
  for(const block of blocks){
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length===0) continue;
    let question = lines[0].replace(/^(س\s*[:：]|Q\s*[:：])/i,'').trim();
    const options = [];
    let answer = '';
    for(let i=1;i<lines.length;i++){
      const line = lines[i];
      if(/^[-*•]/.test(line)){
        options.push(line.replace(/^[-*•]\s*/,'').trim());
      } else if(/^(=|الإجابة\s*[:：]|Answer\s*[:：])/i.test(line)){
        answer = line.replace(/^(=|الإجابة\s*[:：]|Answer\s*[:：])/i,'').trim();
      }
    }
    if(!question) continue;
    if(options.length>=2){
      out.push({ type:'mcq', question, options, answer: answer || options[0] });
    } else if(answer){
      out.push({ type:'short', question, answer });
    }
  }
  return out;
}
async function importQuestions(){

  const statusEl = document.getElementById('importStatus');
  const parsed = parseImportedQuestions(raw);

  });
  await setData('exams:'+g, exams);

  await loadTeacherTab();
}

async function startExam(examId){
  const g = state.gradeId;
  const exams = await getData('exams:'+g, []);
  const exam = exams.find(e=>e.id===examId);
  const bank = await getData('qbank:'+g, []);
  exam.questions = exam.questionIds.map(id=>bank.find(q=>q.id===id)).filter(Boolean);
  state.examInProgress = exam;
  state.examAnswers = {};
  state.view='examTaking';
  paint();
}
function setExamAnswer(qid,val){ state.examAnswers[qid]=val; }

async function submitExam(){
  state.busy = true; paint();
  const exam = state.examInProgress;
  const g = state.gradeId;
  let correct = 0;
  const details = [];
  const shortItems = [];
  const shortQMap = [];

  exam.questions.forEach(q=>{
    const given = state.examAnswers[q.id] || '';
    if(q.type==='mcq'){
      const ok = given.trim() === q.answer.trim();
      if(ok) correct++;
      details.push({question:q.question, type:'mcq', given, correctAns:q.answer, ok});
    } else {
      shortItems.push({question:q.question, modelAnswer:q.answer, studentAnswer:given});
      shortQMap.push(q);
    }
  });

  try{
    let shortResults = [];
    if(shortItems.length>0){
      shortResults = await aiGradeShortAnswers(shortItems);
    }
    shortResults.forEach((r,i)=>{
      const q = shortQMap[i];
      if(r.score>=1) correct++;
      details.push({question:q.question, type:'short', given: state.examAnswers[q.id]||'', modelAnswer:q.answer, ok:r.score>=1, feedback:r.feedback});
    });

    const total = exam.questions.length;
    const results = await getData('results:'+g, []);
    results.unshift({
      id:uid(), examId:exam.id, examTitle:exam.title,
      studentId:state.student.id, studentName:state.student.name,
      score:correct, total, details, date:new Date().toISOString()
    });
    await setData('results:'+g, results);
    state.busy=false;
    state.examInProgress=null;
    state.studentTab='results';
    await loadStudentTab();
  }catch(e){
    console.error(e);
    state.busy=false; state.errorMsg = t('errorAI'); paint();
  }
}

    <table><thead><tr><th>${t('date')}</th><th>${t('studentName')}</th><th></th></tr></thead>
    <tbody>${attendance.slice().reverse().slice(0,40).map(a=>{
      const s = students.find(x=>x.id===a.studentId);
      return `<tr><td>${fmtDate(a.date)}</td><td>${s?s.name:'—'}</td><td><span class="chip ${a.status==='present'?'green':'red'}">${a.status==='present'?t('present'):t('absent')}</span></td></tr>`;
    }).join('')}</tbody></table>`}
  </div>`;
}

function tabHomeworkTeacher(){
  const hw = state.cache.homework||[];
  return `
  <div class="card">
    <h3>${t('homeworkSubmissions')} ${gradeName(findGrade(state.gradeId))}</h3>
    ${hw.length===0?`<div class="empty">${t('noHomework')}</div>`:hw.map(h=>`
      <div class="list-item" style="align-items:start;">
        <div>
          <strong>${h.studentName}</strong>
          <div class="meta">${fmtDate(h.date)}</div>
          <div style="margin-top:6px;">${h.text}</div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function tabMessagesTeacher(){
  const students = state.cache.students||[];
  const msgs = (state.cache.messages||[]).filter(m=>m.studentId===state.msgStudentId);
  const activeStudent = students.find(s=>s.id===state.msgStudentId);
  return `
  <div class="card">
    <h3>${t('tabMessages')}</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      ${students.map(s=>`<button class="tag-btn ${state.msgStudentId===s.id?'active':''}" onclick="openMsgThread('${s.id}')">${s.name}</button>`).join('') || `<div class="empty">${t('noStudents')}</div>`}
    </div>
    ${activeStudent ? `
      <h3 style="font-size:15px;">${t('conversationWith')} ${activeStudent.name}</h3>
      <div style="max-height:320px;overflow:auto;padding:6px 2px;">
        ${msgs.length===0?`<div class="empty">${t('noMessages')}</div>`:msgs.map(m=>`
          <div class="msg ${m.from==='teacher'?'mine':'theirs'}">${m.text}<div class="when">${new Date(m.date).toLocaleString(state.lang==='ar'?'ar-EG':'en-US')}</div></div>
        `).join('')}
      </div>
      <div class="row" style="margin-top:10px;">
        <div class="field"><input id="tMsgText" placeholder="${t('writeMessage')}" onkeydown="if(event.key==='Enter')sendTeacherMessage()"></div>
        <button class="btn" onclick="sendTeacherMessage()">${t('send')}</button>
      </div>
    ` : ''}
  </div>`;
}

function tabResultsTeacher(){
  const results = state.cache.results||[];
  const students = state.cache.students||[];
  const exams = state.cache.exams||[];
  const perExam = exams.map(e=>{
    const related = results.filter(r=>r.examId===e.id);
    const avg = related.length? Math.round(related.reduce((s,r)=>s+pct(r.score,r.total),0)/related.length) : 0;
    return {label:e.title.slice(0,10), value:avg};
  });
  const avgScore = results.length ? Math.round(results.reduce((s,r)=>s+pct(r.score,r.total),0)/results.length) : 0;
  const passRate = results.length ? Math.round(results.filter(r=>pct(r.score,r.total)>=50).length/results.length*100) : 0;
  return `
  <div class="kpi-grid">
    <div class="kpi violet"><div class="label">${t('kpiStudents')}</div><div class="value">${students.length}</div></div>
    <div class="kpi cyan"><div class="label">${t('kpiExamsCreated')}</div><div class="value">${exams.length}</div></div>
    <div class="kpi gold"><div class="label">${t('kpiAttempts')}</div><div class="value">${results.length}</div></div>
    <div class="kpi green"><div class="label">${t('kpiAvgScore')}</div><div class="value">${results.length?avgScore+'%':'—'}</div></div>
  </div>
  <div class="lower-grid">
    <div class="card">
      <h3>${t('allResults')} ${gradeName(findGrade(state.gradeId))}</h3>
      ${results.length===0?`<div class="empty">${t('noResults')}</div>`:`
      <table><thead><tr><th>${t('studentName')}</th><th>${t('tabExams')}</th><th>${t('score')}</th><th>${t('date')}</th></tr></thead>
      <tbody>${results.map(r=>`
        <tr><td>${r.studentName}</td><td>${r.examTitle}</td>
        <td><span class="chip ${pct(r.score,r.total)>=50?'green':'red'}">${r.score} / ${r.total}</span></td>
        <td>${fmtDate(r.date)}</td></tr>
      `).join('')}</tbody></table>`}
    </div>
    <div class="card" style="text-align:center;">
      <h3 style="text-align:start;">${t('gradeAnalytics')} ${t('thisGrade')}</h3>
      ${ringChart(results, state.lang==='ar'?'المتوسط':'Average')}
    </div>
  </div>
  ${exams.length>0?`<div class="card"><h3>${t('perGradeAvg').replace(t('perGradeAvg').split(' ').pop(),'')}${t('exam')}</h3>${barChart(perExam)}</div>`:''}
  `;
}

/* ============================ VIEW: STUDENT DASHBOARD ============================ */
function viewStudentDash(){
  const g = state.gradeId;
  let body = '';
  if(state.studentTab==='overview') body = tabOverviewStudent();
  else if(state.studentTab==='exams') body = tabExamsStudent();
  else if(state.studentTab==='results') body = tabResultsStudent();
  else if(state.studentTab==='attendance') body = tabAttendanceStudent();
  else if(state.studentTab==='homework') body = tabHomeworkStudent();
  else if(state.studentTab==='messages') body = tabMessagesStudent();

  return `
  ${topbar(true)}
  <div class="wrap">
    <div class="dash">
      <div class="ledger-rail">
        <div class="profile-mini">
          <div class="avatar-fallback">${(state.student.name||'?').trim().charAt(0)}</div>
          <div><b>${state.student.name}</b><span>${gradeName(findGrade(g))}</span></div>
        </div>
        ${railTabS('overview','⌂',t('tabOverview'))}
        ${railTabS('exams','✎',t('myExams'))}
        ${railTabS('results','◈',t('myResults'))}
        ${railTabS('attendance','◷',t('myAttendance'))}
        ${railTabS('homework','▦',t('tabHomework'))}
        ${railTabS('messages','✉',t('tabMessages'))}
      </div>
      <div class="dash-main">
        ${state.errorMsg?`<div class="card err">${state.errorMsg}</div>`:''}
        ${body}
      </div>
    </div>
  </div>`;
}
function railTabS(id,icon,label){
  return `<button class="rail-tab ${state.studentTab===id?'active':''}" onclick="showStudentTab('${id}')"><span class="n">${icon}</span>${label}</button>`;
}

function tabOverviewStudent(){
  const exams = (state.cache.exams||[]).filter(e=> e.assignedIds==='all' || e.assignedIds.includes(state.student.id));
  const results = (state.cache.results||[]).filter(r=>r.studentId===state.student.id);
  const attendance = (state.cache.attendance||[]).filter(a=>a.studentId===state.student.id);
  const hw = (state.cache.homework||[]).filter(h=>h.studentId===state.student.id);
  const pending = exams.filter(e=> !results.find(r=>r.examId===e.id)).length;
  const attRate = attendance.length ? Math.round(attendance.filter(a=>a.status==='present').length/attendance.length*100) : 0;
  return `
  <div class="hero-banner">
    <div class="eyebrow">${gradeName(findGrade(state.gradeId))}</div>
    <h1>${t('welcomeStudent')} ${state.student.name} <span>👋</span></h1>
    <p>${t('welcomeStudentSub')}</p>
    <div class="hero-actions">
      <button class="btn" onclick="showStudentTab('exams')">${t('myExams')} →</button>
      <button class="btn outline" onclick="showStudentTab('messages')">${t('tabMessages')}</button>
    </div>
  </div>
  <div class="kpi-grid">
    <div class="kpi violet"><div class="label">${t('examsTaken')}</div><div class="value">${results.length}</div></div>
    <div class="kpi gold"><div class="label">${t('pendingExams')}</div><div class="value">${pending}</div></div>
    <div class="kpi cyan"><div class="label">${t('presentRate')}</div><div class="value">${attendance.length?attRate+'%':'—'}</div></div>
    <div class="kpi green"><div class="label">${t('myAverage')}</div><div class="value">${results.length?Math.round(results.reduce((s,r)=>s+pct(r.score,r.total),0)/results.length)+'%':'—'}</div></div>
  </div>
  <div class="lower-grid">
    <div class="card">
      <h3>${t('myResults')}</h3>
      ${results.length===0?`<div class="empty">${t('noResults')}</div>`:results.slice(0,5).map(r=>`
        <div class="list-item">
          <div><strong>${r.examTitle}</strong><div class="meta">${fmtDate(r.date)}</div></div>
          <span class="chip ${pct(r.score,r.total)>=50?'green':'red'}">${r.score}/${r.total}</span>
        </div>`).join('')}
    </div>
    <div class="card" style="text-align:center;">
      <h3 style="text-align:start;">${t('performanceOverview')}</h3>
      ${ringChart(results, t('myAverage'))}
    </div>
  </div>`;
}

function tabExamsStudent(){
  const exams = (state.cache.exams||[]).filter(e=> e.assignedIds==='all' || e.assignedIds.includes(state.student.id));
  const results = state.cache.results||[];
  return `
  <div class="card">
    <h3>${t('myExams')}</h3>
    ${exams.length===0?`<div class="empty">${t('noExamsAvailable')}</div>`: exams.map(e=>{
      const taken = results.find(r=>r.examId===e.id && r.studentId===state.student.id);
      return `
      <div class="list-item">
        <div>
          <strong>${e.title}</strong>
          <div class="meta">${e.questionIds.length} ${t('questionsCount')}</div>
        </div>
        ${taken ? `<span class="chip gold">${t('alreadyTaken')} · ${taken.score}/${taken.total}</span>`
        : `<button class="btn gold small" onclick="startExam('${e.id}')">${t('startExam')}</button>`}
      </div>`;
    }).join('')}
  </div>`;
}

function tabResultsStudent(){
  const results = (state.cache.results||[]).filter(r=>r.studentId===state.student.id);
  return `
  <div class="card">
    <h3>${t('myResults')}</h3>
    ${results.length===0?`<div class="empty">${t('noResults')}</div>`:results.map(r=>`
      <div class="list-item" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;justify-content:space-between;">
          <strong>${r.examTitle}</strong>
          <span class="chip ${pct(r.score,r.total)>=50?'green':'red'}">${r.score} / ${r.total}</span>
        </div>
        <div class="meta">${fmtDate(r.date)}</div>
        <details style="margin-top:8px;">
          <summary style="cursor:pointer;font-size:13px;color:var(--cyan);">${t('feedback')}</summary>
          ${r.details.map(d=>`
            <div class="qcard" style="margin-top:8px;">
              <div style="font-weight:600;">${d.question}</div>
              <div class="meta">${t('correct')}: ${d.ok?'✅':'❌'} ${d.feedback?(' · '+d.feedback):''}</div>
              ${d.type==='short'?`<div class="meta"><em>${t('modelAnswer')}:</em> ${d.modelAnswer}</div>`:''}
            </div>
          `).join('')}
        </details>
      </div>
    `).join('')}
  </div>`;
}

function tabAttendanceStudent(){
  const att = (state.cache.attendance||[]).filter(a=>a.studentId===state.student.id);
  const presentCount = att.filter(a=>a.status==='present').length;
  const rate = att.length ? Math.round(presentCount/att.length*100) : 0;
  return `
  <div class="card">
    <h3>${t('myAttendance')}</h3>
    <div class="meta" style="margin-bottom:10px;">${t('rate')}: <strong>${rate}%</strong></div>
    ${att.length===0?`<div class="empty">${t('noAttendance')}</div>`:`
    <table><thead><tr><th>${t('date')}</th><th></th></tr></thead>
    <tbody>${att.slice().reverse().map(a=>`<tr><td>${fmtDate(a.date)}</td><td><span class="chip ${a.status==='present'?'green':'red'}">${a.status==='present'?t('present'):t('absent')}</span></td></tr>`).join('')}</tbody></table>`}
  </div>`;
}

function tabHomeworkStudent(){
  const hw = (state.cache.homework||[]).filter(h=>h.studentId===state.student.id);
  return `
  <div class="card">
    <h3>${t('submitHomework')}</h3>
    <div class="field"><textarea id="hwText" placeholder="${t('writeHomework')}"></textarea></div>
    <button class="btn" onclick="submitHomework()">${t('submit')}</button>
  </div>
  <div class="card">
    <h3>${t('yourSubmissions')}</h3>
    ${hw.length===0?`<div class="empty">${t('noneYet')}</div>`:hw.map(h=>`
      <div class="list-item"><div><div>${h.text}</div><div class="meta">${fmtDate(h.date)}</div></div></div>
    `).join('')}
  </div>`;
}

function tabMessagesStudent(){
  const msgs = (state.cache.messages||[]).filter(m=>m.studentId===state.student.id);
  return `
  <div class="card">
    <h3>${t('conversationWith')} ${t('teacherLabel')}</h3>
    <div style="max-height:340px;overflow:auto;padding:6px 2px;">
      ${msgs.length===0?`<div class="empty">${t('noMessages')}</div>`:msgs.map(m=>`
        <div class="msg ${m.from==='student'?'mine':'theirs'}">${m.text}<div class="when">${new Date(m.date).toLocaleString(state.lang==='ar'?'ar-EG':'en-US')}</div></div>
      `).join('')}
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="field"><input id="sMsgText" placeholder="${t('writeMessage')}" onkeydown="if(event.key==='Enter')sendStudentMessage()"></div>
      <button class="btn gold" onclick="sendStudentMessage()">${t('send')}</button>
    </div>
  </div>`;
}

/* ============================ VIEW: EXAM TAKING ============================ */
function viewExamTaking(){
  const exam = state.examInProgress;
  return `
  ${topbar(true)}
  <div class="wrap">
    <div class="card">
      <h3>${exam.title}</h3>
      ${exam.questions.map((q,i)=>`
        <div class="exam-q">
          <div class="qn">${t('question')} ${i+1}. ${q.question}</div>
          ${q.type==='mcq' ? q.options.map(o=>`
            <label class="opt">
              <input type="radio" name="q_${q.id}" value="${o.replace(/"/g,'&quot;')}" onchange="setExamAnswer('${q.id}', this.value)">
              ${o}
            </label>`).join('')
          : `<textarea onInput="setExamAnswer('${q.id}', this.value)" placeholder="…"></textarea>`}
        </div>
      `).join('')}
      ${state.errorMsg?`<div class="err">${state.errorMsg}</div>`:''}
      <button class="btn gold" ${state.busy?'disabled':''} onclick="submitExam()">
        ${state.busy?`<span class="spinner"></span>${t('grading')}`:t('submitExam')}
      </button>
    </div>
  </div>`;
}

/* ============================ INIT ============================ */
paint();
</script>
</body>
</html>
